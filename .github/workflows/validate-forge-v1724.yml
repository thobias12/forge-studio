name: Validate Forge v1.72.4 mocap fix

on:
  push:
    branches: [forge-v1.72.4-mocap-transition-grounding]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Build Forge Studio
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
        run: npm run build
