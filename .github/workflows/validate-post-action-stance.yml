name: Validate post-action idle and stance fix

on:
  push:
    branches: [fix-post-action-idle-and-stance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Build Forge Studio
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
        run: npm run build
