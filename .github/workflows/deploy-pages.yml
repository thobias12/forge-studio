name: Deploy Forge Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Equipment QA browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Prepare Equipment QA fixture
        run: node scripts/prepare-equipment-qa-fixture.mjs

      - name: Build and capture Equipment QA
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
          FORGE_QA_MODEL: artifacts/qa-foundation/Skillbound-Female-Base-v1.qa.glb
          FORGE_QA_BODY: female
          FORGE_QA_OUTPUT: dist/qa/equipment-v3/female
          FORGE_QA_KEEP_MODEL: '1'
        run: npm run qa:equipment

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
