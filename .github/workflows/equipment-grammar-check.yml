name: Equipment Grammar Check

on:
  push:
    branches:
      - feat/equipment-grammar-v1840
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Python
        run: python -m py_compile tools/equipment-processor/procedural_equipment.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Forge Studio
        run: npm run build

      - name: Prepare Skillbound mannequin
        env:
          FORGE_QA_FIXTURE_OUTPUT: artifacts/grammar/mannequin.glb
        run: node scripts/prepare-equipment-qa-fixture.mjs

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Generate all chest styles and variations
        run: |
          mkdir -p artifacts/grammar
          for style in ranger traveler acolyte; do
            for seed in 0 1 2 3; do
              blender --background \
                --python-exit-code 1 \
                --python tools/equipment-processor/procedural_equipment.py \
                -- \
                --mannequin artifacts/grammar/mannequin.glb \
                --output "artifacts/grammar/${style}-v${seed}.glb" \
                --body female \
                --slot chest \
                --style "${style}" \
                --seed "${seed}"
            done
          done

      - name: Generate combined QA models
        run: |
          for style in ranger traveler acolyte; do
            blender --background \
              --python-exit-code 1 \
              --python tools/equipment-processor/procedural_equipment.py \
              -- \
              --mannequin artifacts/grammar/mannequin.glb \
              --output "artifacts/grammar/${style}-qa.glb" \
              --body female \
              --slot chest \
              --style "${style}" \
              --seed 0 \
              --include-body
          done

      - name: Install Equipment QA runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Capture Ranger QA
        env:
          FORGE_QA_MODEL: artifacts/grammar/ranger-qa.glb
          FORGE_QA_BODY: female
          FORGE_QA_OUTPUT: artifacts/grammar-qa/ranger
          FORGE_QA_SKIP_BUILD: '1'
          FORGE_QA_HEADLESS: '1'
          FORGE_QA_NATIVE_MODEL: '1'
        run: npm run qa:equipment

      - name: Capture Traveler QA
        env:
          FORGE_QA_MODEL: artifacts/grammar/traveler-qa.glb
          FORGE_QA_BODY: female
          FORGE_QA_OUTPUT: artifacts/grammar-qa/traveler
          FORGE_QA_SKIP_BUILD: '1'
          FORGE_QA_HEADLESS: '1'
          FORGE_QA_NATIVE_MODEL: '1'
        run: npm run qa:equipment

      - name: Capture Acolyte QA
        env:
          FORGE_QA_MODEL: artifacts/grammar/acolyte-qa.glb
          FORGE_QA_BODY: female
          FORGE_QA_OUTPUT: artifacts/grammar-qa/acolyte
          FORGE_QA_SKIP_BUILD: '1'
          FORGE_QA_HEADLESS: '1'
          FORGE_QA_NATIVE_MODEL: '1'
        run: npm run qa:equipment

      - name: Upload grammar QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-grammar-qa
          path: |
            artifacts/grammar/*.glb
            artifacts/grammar/*.json
            artifacts/grammar-qa
          if-no-files-found: warn
          retention-days: 7
