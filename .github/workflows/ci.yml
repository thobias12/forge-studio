name: Forge Studio PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Equipment QA fixture
        env:
          FORGE_QA_FIXTURE_OUTPUT: public/qa-foundation/__qa-base.glb
        run: node scripts/prepare-equipment-qa-fixture.mjs

      - name: Build Forge Studio
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
        run: npm run build

      - name: Check Equipment Processor scripts
        run: |
          node --check tools/equipment-processor/server.mjs
          python -m py_compile tools/equipment-processor/processor.py
          python -m py_compile tools/equipment-processor/procedural_equipment.py
          python -m py_compile tools/equipment-processor/spar3d_geometry.py

      - name: Install fast QA runtime
        run: |
          npm install --no-save --package-lock=false playwright
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi

      - name: Capture fast Equipment QA
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
          FORGE_QA_MODEL: dist/qa-foundation/__qa-base.glb
          FORGE_QA_BODY: female
          FORGE_QA_OUTPUT: artifacts/equipment-qa-fast
          FORGE_QA_SKIP_BUILD: '1'
          FORGE_QA_HEADLESS: '1'
          FORGE_QA_BROWSER_CHANNEL: chrome
          FORGE_QA_VIEWS: front,front-right,top-down-shoulders,top-back-cape,chest-close,vest-detail-close,right-underarm,cape-profile-tight
        run: npm run qa:equipment

      - name: Upload fast Equipment QA
        uses: actions/upload-artifact@v4
        with:
          name: equipment-qa-fast
          path: artifacts/equipment-qa-fast
          if-no-files-found: error
          retention-days: 3

      - name: Capture Dungeon Visual QA
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
          FORGE_DUNGEON_QA_OUTPUT: artifacts/dungeon-qa-fast
          FORGE_DUNGEON_QA_SKIP_BUILD: '1'
          FORGE_DUNGEON_QA_HEADLESS: '1'
          FORGE_DUNGEON_QA_BROWSER_CHANNEL: chrome
        run: npm run qa:dungeon

      - name: Upload Dungeon Visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-visual-qa-fast
          path: artifacts/dungeon-qa-fast
          if-no-files-found: error
          retention-days: 3
