name: Deploy Forge Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forge-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare deployed Equipment QA fixture
        env:
          FORGE_QA_FIXTURE_OUTPUT: public/qa-foundation/__qa-base.glb
        run: node scripts/prepare-equipment-qa-fixture.mjs

      - name: Build Forge Studio
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
        run: npm run build

      - name: Upload reusable Forge build
        uses: actions/upload-artifact@v4
        with:
          name: forge-dist-${{ github.sha }}
          path: ./dist
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  qa:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download Forge build
        uses: actions/download-artifact@v4
        with:
          name: forge-dist-${{ github.sha }}
          path: dist

      - name: Install Equipment QA runtime
        run: |
          npm install --no-save --package-lock=false playwright
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi

      - name: Capture full Equipment QA
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
          FORGE_QA_MODEL: dist/qa-foundation/__qa-base.glb
          FORGE_QA_BODY: female
          FORGE_QA_OUTPUT: artifacts/equipment-qa
          FORGE_QA_SKIP_BUILD: '1'
          FORGE_QA_HEADLESS: '1'
          FORGE_QA_BROWSER_CHANNEL: chrome
        run: npm run qa:equipment

      - name: Upload Equipment QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-qa-female
          path: artifacts/equipment-qa
          if-no-files-found: warn
          retention-days: 7

      - name: Capture Dungeon Visual QA
        env:
          VITE_FORGE_BUILD: ${{ github.sha }}
          FORGE_DUNGEON_QA_OUTPUT: artifacts/dungeon-qa
          FORGE_DUNGEON_QA_SKIP_BUILD: '1'
          FORGE_DUNGEON_QA_HEADLESS: '1'
          FORGE_DUNGEON_QA_BROWSER_CHANNEL: chrome
        run: npm run qa:dungeon

      - name: Publish Dungeon Renderer Health summary
        if: always()
        run: |
          if [ -f artifacts/dungeon-qa/performance.md ]; then
            cat artifacts/dungeon-qa/performance.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Dungeon Visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-visual-qa
          path: artifacts/dungeon-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Verify live GitHub Pages deployment
        env:
          FORGE_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          FORGE_EXPECTED_BUILD: ${{ github.sha }}
          FORGE_LIVE_VERIFY_OUTPUT: artifacts/deployment-integrity
          FORGE_LIVE_BROWSER_CHANNEL: chrome
        run: npm run qa:live

      - name: Publish live deployment integrity summary
        if: always()
        run: |
          if [ -f artifacts/deployment-integrity/summary.md ]; then
            cat artifacts/deployment-integrity/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload deployment integrity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-integrity
          path: artifacts/deployment-integrity
          if-no-files-found: warn
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
