name: Validate Evergrow-inspired 3D characters

on:
  push:
    branches: [forge-1.53-evergrow-3d]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Forge Studio
        run: npm run build
