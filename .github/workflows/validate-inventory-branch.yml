name: Validate inventory branch

on:
  push:
    branches:
      - evergrow-uiforge-inventory-v1.72.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Forge Studio
        run: npm run build
